# Configurações do Servidor
server.port=8080

# Configurações do Banco de Dados Oracle
# Altere o host, porta e SID/Serviço de acordo com seu ambiente Oracle
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:RM552795}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oracle}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração da Chave Secreta do JWT
api.security.token.secret=${JWT_SECRET:my-secret-key-gs-agro-id-2026-very-secure-random-key-here}

# Configurações de Documentação OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
